services:
  backend:
    build:
      context: ./backend
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    environment:
      STARTUP_DELAY_SECONDS: ${STARTUP_DELAY_SECONDS:-0}
      FAIL_READINESS: ${FAIL_READINESS:-false}
    ports: ["127.0.0.1:${BACKEND_PORT:-8000}:8000"]
    init: true
    stop_grace_period: 35s
  frontend:
    build:
      context: ./frontend
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    ports: ["127.0.0.1:${FRONTEND_PORT:-8080}:8080"]
    depends_on:
      backend:
        condition: service_healthy
    stop_grace_period: 35s
