name: Validate and publish
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm run lint && npm test && npm run build
        working-directory: frontend
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r backend/requirements-dev.txt
      - run: ruff check backend scripts tests
      - run: PYTHONPATH=backend pytest backend/tests tests -q
      - run: python scripts/validate.py
  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
        with: {version: 'v1.34.1'}
      - uses: actions/setup-go@v5
        with: {go-version: '1.24'}
      - run: go install github.com/yannh/kubeconform/cmd/kubeconform@v0.7.0
      - run: kubectl kustomize kubernetes | kubeconform -strict -summary -kubernetes-version 1.34.0
  containers:
    runs-on: ubuntu-latest
    needs: [frontend, backend, manifests]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: bash scripts/container-test.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: container-evidence, path: artifacts/}
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [containers]
    runs-on: ubuntu-latest
    strategy:
      matrix: {app: [backend, frontend]}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.app }}
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/rolling-${{ matrix.app }}:${{ github.sha }}
          build-args: APP_VERSION=${{ github.sha }}
          provenance: true
