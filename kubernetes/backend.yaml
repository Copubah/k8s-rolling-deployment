apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: rolling-demo
spec:
  replicas: 3
  revisionHistoryLimit: 5
  minReadySeconds: 5
  progressDeadlineSeconds: 120
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels: {app: backend}
  template:
    metadata:
      labels: {app: backend}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 35
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: backend
          image: rolling-backend:local
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 8000}]
          envFrom: [{configMapRef: {name: backend-config}}]
          env:
            - {name: FAIL_READINESS, value: "false"}
          resources:
            requests: {cpu: 100m, memory: 96Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          startupProbe:
            httpGet: {path: /health/live, port: http}
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet: {path: /health/live, port: http}
            periodSeconds: 10
            timeoutSeconds: 2
          readinessProbe:
            httpGet: {path: /health/ready, port: http}
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 1
          lifecycle:
            preStop:
              exec:
                command: [python, -c, "import time; time.sleep(5)"]
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: rolling-demo
  labels: {app: backend}
spec:
  type: ClusterIP
  selector: {app: backend}
  ports: [{name: http, port: 8000, targetPort: http}]
